org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Some plugins (e.g. receive_sharing_intent) set a Java target that differs from
# the Kotlin JVM target. Relax the strict check to a warning so the build runs.
kotlin.jvm.target.validation.mode=warning
# Optimized resource shrinking: R8 shrinks resources together with code, so
# fewer unused resources ship. Names looked up only at runtime are pinned in
# app/src/main/res/raw/keep.xml; add any new ones there. Default in AGP 9.
android.r8.optimizedResourceShrinking=true
