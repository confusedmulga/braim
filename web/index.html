<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    `--base-href` replaces this placeholder at build time. The phone serves the
    app at "/", and so does a static host at a domain root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Braim: your notes, sparks, journal and books.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Braim">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Braim</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown until Flutter paints its first frame, so the engine download never
       flashes a blank white page. Matches the app's surface in both themes. */
    :root { --surface: #faf8ff; --ink: #4d5c92; }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #121318; --ink: #b6c4ff; }
    }
    html, body { margin: 0; height: 100%; background: var(--surface); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: var(--surface); transition: opacity 180ms ease-out;
    }
    #splash img { width: 72px; height: 72px; border-radius: 18px; }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: color-mix(in srgb, var(--ink) 18%, transparent);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: var(--ink); border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Braim">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
